<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css"> </head>

<body onload="resetSessao()">
    <div class="auth-recipiente">
        
        <div class="auth-lateral-esq">
            <div class="auth-caixa">
                <a href="index.html">
                    <img class="auth-logo" src="./assets/LogoComEscrita.png" alt="HyperTech Logo">
                </a>
                
                <h1 class="auth-titulo">Crie sua conta</h1>
                
                <div class="auth-formulario">
                    <div class="auth-grupo-input">
                        <label for="input_nome">Nome</label>
                        <input type="text" id="input_nome" value="Paulo" placeholder="Ex: Maria Antonia Oliveira">
                    </div>
                    
                    <div class="auth-grupo-input">
                        <label for="input_cnpj">CNPJ</label>
                        <input oninput="valCnpj()" type="text" id="input_cnpj" value="12.345.678-0123-45" maxlength="18" placeholder="Ex. XX.XXX.XXX/0001-XX">
                    </div>
                    
                    <div class="auth-grupo-input">
                        <label for="input_email">E-mail</label>
                        <input oninput="valEmail()" type="text" id="input_email" value="seguradora@gmail.com" placeholder="Ex. hypertech@gmail.com">
                    </div>
                    
                    <div class="auth-grupo-input">
                        <label for="input_senha">Senha</label>
                        <input type="password" id="input_senha" value="Abcd#1234" placeholder="******">
                    </div>
                    
                    <div class="auth-grupo-input">
                        <label for="input_confirmacao">Confirmar senha</label>
                        <input type="password" id="input_confirmacao" value="Abcd#1234" placeholder="******">
                    </div>
                </div>
                
                <div id="res" class="auth-mensagem">Preencher todos os campos!</div>
                
                <button class="auth-botao" onclick="criar()">Cadastrar</button>
                <a class="auth-link" href="login.html">Já possui uma conta? <br />Faça login agora</a>
            </div>
        </div>

        <div class="auth-lateral-dir">
            <h2 class="auth-frase-fixa">Para você focar apenas no que importa!</h2>
        </div>
        
    </div>
    </body>
    </html>

    <script>
        function mascara() {
            var cnpj = document.getElementById('input_cnpj')
            if( cnpj.value.length == 2 ||  cnpj.value.length == 6){
                cnpj.value += "."
            }
            if(cnpj.value.length == 10){
                cnpj.value += "/"
            }
            if(cnpj.value.length == 15){
                cnpj.value += "-"
            }
        }

        function valCnpj() {
            var cnpj = document.getElementById('input_cnpj').value
            var tamanhoOri = cnpj.length
            var tamanho = cnpj.length - 1
            
            if (!isNaN(cnpj[tamanho]) && !(cnpj[tamanho] == ' ')) { // Deixa digitar apenas números
                if (tamanho == 2 || tamanho == 6) { // Coloca os pontos automaticamente no CNPJ
                    input_cnpj.value = input_cnpj.value.slice(0, -1) + '.' + input_cnpj.value[tamanho]
                } else if (tamanho == 10 && cnpj[10] != '/') { // Coloca a barra automaticamente no CNPJ
                    input_cnpj.value = input_cnpj.value.slice(0, -1) + '/' + input_cnpj.value[tamanho]
                } else if ((tamanho == 15 && cnpj[15] != '-')) { // Coloca o traço automaticamente no CNPJ
                    input_cnpj.value = input_cnpj.value.slice(0, -1) + '-' + input_cnpj.value[tamanho]
                }    
            } else { // Apaga o caractere caso não seja um número
                input_cnpj.value = input_cnpj.value.slice(0, -1)
            }

            if (tamanhoOri > 18) { // Não deixa colocar mais que 18 caracteres
                input_cnpj.value = input_cnpj.value.slice(0, -1)
            }
        }
         
        function valEmail() {
            var email = document.getElementById('input_email').value

            var tamanho = email.length - 1
            
            if (email.includes('@')) { // Não pode ter mais de 1 '@'
                email = email.replace('@', '*')
                if (email.includes('@')) {
                    res.innerHTML = 'Apenas 1 "@" é permitido'
                } else {
                    res.innerHTML = ''
                }    
            } else {
                res.innerHTML = ''
            }    

            if (email[0] == '.' || (email[tamanho] == '.' && email[(tamanho - 1)] == '.')) { // Não deixa começar com ponto e nem ter 2 pontos seguidos
                input_email.value = input_email.value.slice(0, -1)
            }
            
            if (email[tamanho] == ' ' || email[tamanho] == ',' || email[tamanho] == ':' || email[tamanho] == ';') { // Não pode usar 'espaço', 'vírgula', ':', ';'
                input_email.value = input_email.value.slice(0, -1)
            }
        }
        
        function criar() {
            var nomeVar = input_nome.value.trim();
            var cnpjVar = input_cnpj.value.trim();
            var emailVar = input_email.value.trim();
            var senhaVar = input_senha.value;
            var confirmSenhaVar = input_confirmacao.value;

            res.innerText = ''
            document.getElementById('res').classList.remove('textRed')
            document.getElementById('res').classList.remove('textGreen')
            // Verificando se há algum campo em branco
            if (nomeVar == '' ||
                emailVar == '' ||
                cnpjVar == '' ||
                senhaVar == '' ||
                confirmSenhaVar == ''
            ) {
                document.getElementById('res').textContent = 'Preencha todos os campos!'
                document.getElementById('res').classList.add('textRed')
                return false
            }
            
            if (nomeVar.length < 3) {
                res.innerText = 'Nome deve conter pelo menos 3 caracteres.'
                document.getElementById('res').classList.add('textRed')
                return
            }

            if (!emailVar.includes('@')) {
                res.innerText = 'E-mail deve conter pelo menos 1 @.'
                document.getElementById('res').classList.add('textRed')
                return
            }

            var antesA = emailVar.split('@')

            if (antesA[0].length < 3) {
                res.innerText = 'E-mail deve conter pelo menos 3 caracteres antes do @.'
                document.getElementById('res').classList.add('textRed')
                return
            }

            if (antesA[1].length < 3) {
                res.innerText = 'E-mail deve conter pelo menos 3 caracteres depois do @.'
                document.getElementById('res').classList.add('textRed')
                return
            }
            
            if (cnpjVar.length != 18) {
                res.innerText = 'CNPJ inválido.'
                document.getElementById('res').classList.add('textRed')
                return
            }
            
            if (senhaVar.length < 8) {
                res.innerText = 'A senha deve conter no minímo 8 caracteres.'
                document.getElementById('res').classList.add('textRed')
                return
            }

            var senhaNumber = false
            for (var i = 0; i < senhaVar.length; i++) {
                if (!isNaN(senhaVar[i])) {
                    senhaNumber = true
                }
            }
            
            if (!senhaNumber) {
                res.innerText = 'A senha deve conter no minímo 1 número.'
                document.getElementById('res').classList.add('textRed')
                return
            }
            
            var especiais = `!@#$%&*()_.,;:+-/`
            var temCEspecial = false
            for (var i = 0; i < senhaVar.length; i++) {
                if (especiais.includes(senhaVar[i])) {
                    temCEspecial = true
                }
            }

            if (!temCEspecial) {
                // (! @ # $ % & * ( ) _ . , ; : + - / )
                res.innerText = 'A senha deve conter no minímo 1 caracter especial.'
                document.getElementById('res').classList.add('textRed')
                return
            }
            
            if (senhaVar == senhaVar.toLowerCase()) {
                res.innerText = 'A senha deve conter no minímo uma letra maiúscula.'
                document.getElementById('res').classList.add('textRed')
                return    
            }
            
            if (senhaVar == senhaVar.toUpperCase()) {
                res.innerText = 'A senha deve conter no minímo uma letra minúscula.'
                document.getElementById('res').classList.add('textRed')
                return    
            }
            
            if (senhaVar != confirmSenhaVar) {
                res.innerText = 'O Campo Confirmar senha deve ser igual ao campo Senha'
                document.getElementById('res').classList.add('textRed')
                return        
            }

            res.innerText = ''
            document.getElementById('res').classList.remove('textRed')

            
            fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                
                nomeServer: nomeVar,
                emailServer: emailVar,
                cnpjServer: cnpjVar,
                senhaServer: senhaVar,
                
            }),
            })
            .then(async function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    document.getElementById('res').classList.remove('textRed')
                    res.textContent = "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
                    document.getElementById('res').classList.add('textGreen')

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");
                }

                let respostaVar = await resposta.json()
                
                if (respostaVar.erro === "EMAIL_DUPLICADO") {
                    res.innerText = 'Este email já está cadastrado.'
                    document.getElementById('res').classList.add('textRed')
                    return        
                }
                // if (resposta.erro === "EMAIL_DUPLICADO") {
                //     alert('Este email já está cadastrado.')
                //     return
                // }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
            });

            return false;
        }

        function resetSessao() {
            sessionStorage.clear()
        }
    </script>
